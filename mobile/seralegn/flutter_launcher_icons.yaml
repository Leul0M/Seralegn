flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "assets/back.png"
  adaptive_icon_foreground: "assets/front.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#1B8F82"
    theme_color: "#1B8F82"

  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/app_icon.png"
